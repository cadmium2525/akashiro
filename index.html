<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f3e6c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ウルトラ赤白帽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="top">
      <div class="row">
        <div id="phaseTitle"></div>
        <div id="timeText"></div>
      </div>
      <div class="timer"><div id="timerFill"></div></div>
      <div id="phaseDesc"></div>
    </div>
    <div id="sample"><span>おてほん</span></div>
    <div id="hints"><div class="hint L"></div><div class="hint R"></div></div>
    <div class="bottom">
      <div id="gauges"></div>
      <button id="okBtn">できた！</button>
    </div>
  </div>

  <div id="banner" class="hidden"></div>
  <div id="flash"></div>

  <div id="title" class="screen">
    <div class="card">
      <div class="logo">
        <span class="r">ウルトラ</span><span class="w">赤白帽</span>
      </div>
      <p class="lead">赤白帽子で<b>ウルトラマン</b>をつくろう！<br>左右の手をスワイプして帽子の形をととのえ、<br>最後は友だちにかぶせよう。</p>
      <div class="howto">
        <div><b>1</b> 上スワイプで<span class="red">赤いところ</span>を立てる</div>
        <div><b>2</b> 内側スワイプでつまんで、とがらせる</div>
        <div><b>3</b> 下スワイプでゴムをかける</div>
        <div><b>4</b> 上スワイプでかぶせる！</div>
      </div>
      <div class="diffs">
        <button data-diff="easy">かんたん</button>
        <button data-diff="normal" class="main">ふつう</button>
        <button data-diff="hard">むずかしい</button>
      </div>
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div class="card">
      <div id="rank"></div>
      <div id="rankName"></div>
      <div id="total"></div>
      <div id="breakdown"></div>
      <div class="diffs">
        <button id="retryBtn" class="main">もういちど</button>
        <button id="menuBtn">むずかしさをえらぶ</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
